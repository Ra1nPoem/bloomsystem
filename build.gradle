plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    runs {
        client {
            programArgs "--quickPlaySingleplayer", "TestWorld"
        }
    }
}

repositories {
    maven {
        name = 'BlameJared (Veil)'
        url = 'https://maven.blamejared.com'
    }
    maven {
        name = 'Ladysnake (CCA)'
        url = 'https://maven.ladysnake.org/releases'
    }
    maven {
        name = 'isXander (YACL)'
        url = 'https://maven.isxander.dev/releases'
        content { includeGroup 'dev.isxander' }
    }
    maven {
        name = 'RyanCode (ImGuiMC)'
        url = 'https://maven.ryancode.dev/releases'
        content { includeGroup 'foundry.imgui' }
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven {
        name = 'QuiltMC'
        url = 'https://maven.quiltmc.org/repository/release'
    }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // 核心渲染管线（需求指定）
    modImplementation("foundry.veil:veil-fabric-${project.minecraft_version}:${project.veil_version}") {
        exclude group: 'maven.modrinth'
    }
    // ImGuiMC 是 Veil 的运行时依赖；本机 maven 不可达时先不硬依赖，编译/运行说明见 README
    // modImplementation "foundry.imgui:imgui-fabric-${project.minecraft_version}:${project.imgui_version}"

    // 数据组件（需求指定）
    modImplementation "dev.onyxstudios.cardinal-components-api:cardinal-components-base:${project.cca_version}"
    modImplementation "dev.onyxstudios.cardinal-components-api:cardinal-components-entity:${project.cca_version}"

    // 配置库（需求指定，可选面板）
    modImplementation "dev.isxander:yet-another-config-lib:${project.yacl_version}"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}
